services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aih
      POSTGRES_PASSWORD: aih
      POSTGRES_DB: ai_asset_hub
    ports:
      # 宿主 5433：本机 5432 被其他项目 dev PG（skillhub）占用
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aih -d ai_asset_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
