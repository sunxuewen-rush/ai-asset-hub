name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · lint · format · build · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aih
          POSTGRES_PASSWORD: aih
          POSTGRES_DB: ai_asset_hub
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aih -d ai_asset_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 与 docker-compose.yml 的本地开发库同构（宿主端口 5433 → 容器 5432）
      DATABASE_URL: postgres://aih:aih@localhost:5433/ai_asset_hub
      # config/env 全量 zod 校验要求 SESSION_SECRET >= 32 字符（仅 CI 用占位值）
      SESSION_SECRET: ci-only-session-secret-placeholder-32chars

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      # 格式门禁（biome）：人手写代码必须 format-clean；生成物 apps/server/drizzle/meta/** 已在
      # biome.json files.includes 中排除（生成物归 drizzle-kit，见 AGENTS.md）
      - name: format:check
        run: bun run format:check

      - name: build
        run: bun run build

      # 先迁移再测试：各测试文件在 beforeAll 各自调用 migrate()，冷库并发迁移会互相踩；
      # 预迁移后 migrate 变为 no-op（与本地开发流程一致：起库 → 迁移 → 校验）
      - name: db:migrate
        run: bun run db:migrate

      - name: test
        run: bun run test
