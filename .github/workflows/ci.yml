name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · lint · format · doc · build · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aih
          POSTGRES_PASSWORD: aih
          POSTGRES_DB: ai_asset_hub
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aih -d ai_asset_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 与 docker-compose.yml 的本地开发库同构（宿主端口 5433 → 容器 5432）
      DATABASE_URL: postgres://aih:aih@localhost:5433/ai_asset_hub
      # config/env 全量 zod 校验要求 SESSION_SECRET >= 32 字符（仅 CI 用占位值）
      SESSION_SECRET: ci-only-session-secret-placeholder-32chars

    steps:
      # fetch-depth: 0 —— 「头部下沉覆盖」检查需要**提交区间**（doc-audit 只看当前状态，
      # 看不见「删了什么」）；浅克隆会让该检查退化为 N/A（显式打印，不静默）
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      # 格式门禁（biome）：人手写代码必须 format-clean；生成物 apps/server/drizzle/meta/** 已在
      # biome.json files.includes 中排除（生成物归 drizzle-kit，见 AGENTS.md）
      - name: format:check
        run: bun run format:check

      # 文档体检（doc-audit）：版本头 ↔ 修订记录表一致性 / 死路径引用 / 头部长度告警
      # 纯只读、无外部依赖（不连库）⇒ 紧跟 format:check，早失败早暴露
      - name: 文档体检
        run: bun docs/smoke/scripts/doc-audit.ts

      # 文档断言回读（doc-claims-check）：把文档里的量化声明（i18n 叶子键数 / 迁移号 / 断言数 …）
      # 与代码真值回读比对 —— 纯静态、不连库（doc-audit 管「形式」，本件管「声明 vs 真值」）
      - name: 文档断言回读
        run: bun docs/smoke/scripts/doc-claims-check.ts

      # 头部下沉覆盖（head-sink-coverage）：**被删的头部版本行**，其裸 token（路径 / 版号 / F 号 /
      # 反引号标识 / ≥2 位数）必须在 post-state 同文件内仍可找到 —— 拦「头部行删了但内容没留住」
      # （2026-09-28 实证：该缺陷既无状态可见性、doc-audit 也看不见 ⇒ 单立本维）。
      # 比对区间 = push 的 before..HEAD。base / head **缺失、为空或不可解析**（首推 / force push /
      # pull_request 事件无 before）⇒ 本步骤**显式 N/A 并退出 0，不替换成其它区间**（不猜、不静默假绿）。
      - name: 头部下沉覆盖
        run: bun docs/smoke/scripts/head-sink-coverage.ts --base "${{ github.event.before }}" --head "${{ github.sha }}"

      # 修订表结构完整性（table-structure-check）：段内**单调** · 无**重复**版号 · 同主版号**无空洞**
      # （兑现主 design v1.58 行登记 F96 的候选检查；2026-09-28 负控实证：此前 doc-audit /
      #  doc-claims / head-sink 三道门禁对「删一行表行」**全绿** ⇒ 该缺陷无闸，历史已发生 3 例）
      # 史实性跳号入 `docs/smoke/table-structure-waivers.json`（逐条带理由，N/A 明细打印）
      - name: 修订表结构完整性
        run: bun docs/smoke/scripts/table-structure-check.ts

      # 件面 ↔ 引用闭合（file-ref-closure-check · **M4b-7 T9 新增第五道**）：
      # 管「批 design 声明的件面」与「全文引用的路径」是否闭合 —— ① 件路径分档断言（N 新建允许不存在 /
      # M 改造必须已存在）② 引用路径 ⊆ 件面 ∪ 豁免集；拦「改了口径忘了加件」类残留（M4b-7 F7 即此类）。
      # ⚠️ 该脚本用 `git ls-files`-free 的工作区读取（不依赖暂存），故 CI 与本地同语义。
      - name: 件面引用闭合
        run: bun docs/smoke/scripts/file-ref-closure-check.ts

      - name: build
        run: bun run build

      # 先迁移再测试：各测试文件在 beforeAll 各自调用 migrate()，冷库并发迁移会互相踩；
      # 预迁移后 migrate 变为 no-op（与本地开发流程一致：起库 → 迁移 → 校验）
      - name: db:migrate
        run: bun run db:migrate

      - name: test
        run: bun run test
